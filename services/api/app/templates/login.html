{% extends "base.html" %}{% block title %}Acceso del personal{% endblock %}
{% block body %}
<div style="max-width:400px">
  <h1>Acceso del personal</h1>
  <p class="sub">Para auxiliares, analistas, coordinadores y administradores de selección.</p>
  {% if error %}<div class="alert err">{{ error }}</div>{% endif %}
  <form class="card" method="post" action="/login">
    <label style="margin-top:0">Correo</label><input name="correo" type="email" required autofocus>
    <label>Contraseña</label><input name="password" type="password" required>
    <p><button class="btn" style="width:100%">Ingresar</button></p>
  </form>
</div>
{% endblock %}
